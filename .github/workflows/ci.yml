# NEDEN CI: Her push ve pull request'te otomatik olarak format, statik analiz, testler ve build
# çalışıyor. Bozuk kod main branch'e girmeden yakalanıyor.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # NEDEN service container: CI'da gerçek bir PostgreSQL çalışıyor, böylece entegrasyon
    # testleri (postgres_test.go) atlanmıyor, gerçekten çalışıyor.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kyc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      # NEDEN go-version-file: Go versiyonu go.mod'dan okunuyor; iki yerde ayrı ayrı tutulmuyor.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # NEDEN gofmt kontrolü: Go'da tek bir resmi format var. Formatlanmamış kod CI'da reddediliyor,
      # code review'da format tartışması olmuyor.
      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      # NEDEN go vet: Derleyicinin yakalamadığı şüpheli kodları buluyor (ör. yanlış Printf formatı).
      - name: Vet
        run: go vet ./...

      # NEDEN -race: Race detector eşzamanlılık hatalarını yakalıyor.
      # NEDEN -count=1: Go test sonuçlarını önbelleğe alır; bu bayrak testlerin her seferinde gerçekten çalışmasını sağlıyor.
      - name: Test (with race detector and PostgreSQL)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/kyc_test?sslmode=disable
        run: go test -race -count=1 ./...

      - name: Build
        run: go build ./cmd/api

  # NEDEN ayrı job ve "needs: test": Docker imajı sadece testler geçerse build ediliyor.
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t kyc-screening-api:${{ github.sha }} .
